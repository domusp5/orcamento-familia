<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orçamento">
<title>Orçamento Familiar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f3ef;color:#1a1a18}
body{padding-bottom:90px}
.header{background:#1a1a18;color:#fff;padding:16px 20px 12px;position:sticky;top:0;z-index:50}
.header-row{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;font-weight:600;letter-spacing:-0.3px}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#639922;flex-shrink:0}
.sync-dot.syncing{background:#BA7517;animation:pulse 1s infinite}
.sync-dot.error{background:#E24B4A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.cycle-bar{display:flex;gap:8px;margin-top:10px}
.cycle-btn{flex:1;padding:7px 6px;border-radius:20px;border:1.5px solid #3a3a38;background:transparent;color:#888780;font-size:11px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.cycle-btn.active{background:#fff;color:#1a1a18;border-color:#fff}
.cycle-sub{font-size:9px;color:#888780;padding:4px 20px 0;text-align:center}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e8e6e0}
.tab{flex:1;padding:11px;font-size:13px;font-weight:500;color:#888780;border:none;background:none;border-bottom:2.5px solid transparent;cursor:pointer;transition:all .15s}
.tab.active{color:#1a1a18;border-bottom-color:#1a1a18}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 14px 6px}
.sum-card{background:#fff;border-radius:12px;border:.5px solid #e8e6e0;padding:11px 13px}
.sum-label{font-size:10px;color:#888780;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-weight:600}
.sum-val{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.sum-val.ok{color:#27500A}
.sum-val.warn{color:#633806}
.sum-val.bad{color:#A32D2D}
.section-label{font-size:10px;font-weight:700;color:#888780;text-transform:uppercase;letter-spacing:.8px;padding:8px 14px 4px}
.cats{padding:0 14px;display:flex;flex-direction:column;gap:7px}
.cat-card{background:#fff;border-radius:12px;border:.5px solid #e8e6e0;padding:11px 13px}
.cat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.cat-left{display:flex;align-items:center;gap:8px}
.cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cat-name{font-size:13px;font-weight:500}
.cat-right{text-align:right}
.cat-spent{font-size:14px;font-weight:700}
.cat-teto{font-size:11px;color:#888780}
.bar-bg{height:4px;border-radius:2px;background:#f4f3ef;overflow:hidden;margin-bottom:5px}
.bar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.cat-saldo{font-size:10px;color:#888780}
.cat-saldo.over{color:#A32D2D;font-weight:600}
.fab{position:fixed;bottom:24px;right:20px;width:60px;height:60px;border-radius:50%;background:#1a1a18;color:#fff;border:none;font-size:32px;line-height:60px;text-align:center;cursor:pointer;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.25);transition:transform .15s;display:block}
.fab:active{transform:scale(.92)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200}
.overlay.open{display:block}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:#fff;border-radius:20px 20px 0 0;padding:14px 20px 44px;max-height:94vh;overflow-y:auto;z-index:201}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:#e8e6e0;margin:0 auto 16px}
.sheet h2{font-size:16px;font-weight:600;margin-bottom:16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;color:#888780;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.field select,.field input{width:100%;font-size:16px;padding:11px 13px;border:1.5px solid #e8e6e0;border-radius:10px;background:#f9f8f5;color:#1a1a18;appearance:none;-webkit-appearance:none;outline:none}
.field select:focus,.field input:focus{border-color:#1a1a18}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{font-size:11px;color:#A32D2D;margin-top:3px;display:none}
.btn-save{width:100%;padding:14px;border:none;border-radius:12px;background:#1a1a18;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-save:active{opacity:.8}
.hist-wrap{padding:0 14px}
.hist-group-label{font-size:10px;font-weight:700;color:#888780;text-transform:uppercase;letter-spacing:.6px;padding:10px 0 5px}
.hist-item{background:#fff;border-radius:11px;border:.5px solid #e8e6e0;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hist-left{flex:1;min-width:0}
.hist-cat{font-size:13px;font-weight:500}
.hist-meta{font-size:11px;color:#888780;margin-top:2px}
.hist-right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:10px}
.hist-val{font-size:14px;font-weight:600}
.hist-del{font-size:22px;color:#ccc;cursor:pointer;line-height:1;padding:2px 4px}
.empty{text-align:center;padding:40px 20px;color:#888780;font-size:14px}
@media(prefers-color-scheme:dark){
  body{background:#111110}
  .header{background:#0d0d0c}
  .tabs,.sum-card,.cat-card,.hist-item,.sheet{background:#1e1e1c}
  .tabs{border-bottom-color:#2e2e2b}
  .sum-card,.cat-card,.hist-item{border-color:#2e2e2b}
  .field select,.field input{background:#141413;border-color:#2e2e2b;color:#f0ede8}
  .bar-bg{background:#2e2e2b}
  .section-label,.sum-label,.field label,.hist-meta,.cat-saldo,.cat-teto,.cycle-sub{color:#6b6a66}
  .tab{color:#6b6a66}
  .tab.active{color:#f0ede8}
  .h1,.sum-val,.cat-name,.cat-spent,.hist-cat,.hist-val{color:#f0ede8}
  .cycle-btn{border-color:#2e2e2b;color:#6b6a66}
  .cycle-btn.active{background:#f0ede8;color:#1a1a18;border-color:#f0ede8}
  .sheet-handle{background:#2e2e2b}
  .hist-group-label{color:#6b6a66}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <h1>Orçamento familiar</h1>
    <div class="sync-dot" id="sync-dot"></div>
  </div>
  <div class="cycle-bar">
    <button class="cycle-btn" id="btn-thiago" onclick="setCycle('thiago')">Thiago<br><span style="font-size:9px;opacity:.7">dia 9 → 8</span></button>
    <button class="cycle-btn" id="btn-taina"  onclick="setCycle('taina')">Tainá<br><span style="font-size:9px;opacity:.7">dia 3 → 2</span></button>
    <button class="cycle-btn active" id="btn-familia" onclick="setCycle('familia')">Família<br><span style="font-size:9px;opacity:.7">visão geral</span></button>
  </div>
  <div class="cycle-sub" id="cycle-sub"></div>
</div>

<div class="tabs">
  <button class="tab active" id="tab-tetos" onclick="switchTab('tetos',this)">Tetos</button>
  <button class="tab" id="tab-historico" onclick="switchTab('historico',this)">Histórico</button>
</div>

<div id="view-tetos">
  <div class="summary" id="summary"></div>
  <div class="section-label">Por categoria</div>
  <div class="cats" id="cats"></div>
</div>

<div id="view-historico" style="display:none">
  <div class="hist-wrap" id="hist-wrap"></div>
</div>

<button class="fab" id="fab-btn">+</button>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <h2>Registrar gasto</h2>
    <div class="field">
      <label>Categoria</label>
      <select id="inp-cat"></select>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Valor (R$)</label>
        <input type="number" id="inp-val" placeholder="0,00" min="0.01" step="0.01" inputmode="decimal">
      </div>
      <div class="field">
        <label>Data</label>
        <input type="date" id="inp-date">
      </div>
    </div>
    <div class="field">
      <label>Quem pagou</label>
      <select id="inp-pessoa">
        <option value="thiago">Thiago</option>
        <option value="taina">Tainá</option>
        <option value="familia">Os dois / família</option>
      </select>
    </div>
    <div class="field">
      <label>Descrição (opcional)</label>
      <input type="text" id="inp-desc" placeholder="Ex: Guanabara, iFood sábado…">
    </div>
    <div class="err" id="err-val">Informe um valor maior que zero.</div>
    <button class="btn-save" id="btn-save">Salvar gasto</button>
  </div>
</div>

<script>
var CATS = [
  {id:'mercado',    name:'Mercado + Hortifruti', teto:2200, color:'#1D9E75', dark:'#085041'},
  {id:'feira',      name:'Feira livre',           teto:700,  color:'#639922', dark:'#27500A'},
  {id:'padaria',    name:'Padaria',               teto:300,  color:'#BA7517', dark:'#633806'},
  {id:'ifood',      name:'iFood (fim de semana)', teto:400,  color:'#D85A30', dark:'#712B13'},
  {id:'comida_rua', name:'Comida na rua',         teto:800,  color:'#D4537E', dark:'#72243E'},
  {id:'uber',       name:'Uber / 99',             teto:1000, color:'#378ADD', dark:'#0C447C'},
  {id:'lazer',      name:'Lazer (exceto iFood)',  teto:500,  color:'#7F77DD', dark:'#3C3489'},
  {id:'julia',      name:'Júlia',                 teto:800,  color:'#993556', dark:'#4B1528'},
  {id:'outros',     name:'Outros',                teto:500,  color:'#888780', dark:'#444441'},
  {id:'parcelas',   name:'Compras parceladas',    teto:600,  color:'#1a6fbd', dark:'#0C447C'},
  {id:'assinaturas',name:'Assinaturas',           teto:250,  color:'#5F5E5A', dark:'#2e2e2b'}
];
var TETO_TOTAL = CATS.reduce(function(s,c){return s+c.teto;},0);

var currentCycle = 'familia';
var currentTab   = 'tetos';
var gastos       = [];
var db           = null;

function getCycleRange(type) {
  var hoje = new Date();
  var ano  = hoje.getFullYear();
  var mes  = hoje.getMonth();
  var dia  = hoje.getDate();
  var inicio, fim;
  if (type === 'thiago') {
    if (dia >= 9) {
      inicio = new Date(ano, mes, 9);
      fim    = new Date(ano, mes+1, 8);
    } else {
      inicio = new Date(ano, mes-1, 9);
      fim    = new Date(ano, mes, 8);
    }
  } else if (type === 'taina') {
    if (dia >= 3) {
      inicio = new Date(ano, mes, 3);
      fim    = new Date(ano, mes+1, 2);
    } else {
      inicio = new Date(ano, mes-1, 3);
      fim    = new Date(ano, mes, 2);
    }
  } else {
    if (dia >= 3) {
      inicio = new Date(ano, mes, 3);
      fim    = new Date(ano, mes+1, 8);
    } else {
      inicio = new Date(ano, mes-1, 3);
      fim    = new Date(ano, mes, 8);
    }
  }
  return {inicio:inicio, fim:fim};
}

function fmt2(n){return String(n).padStart(2,'0');}
function fmtDate(d){return fmt2(d.getDate())+'/'+fmt2(d.getMonth()+1);}

function updateCycleSub() {
  var r = getCycleRange(currentCycle);
  document.getElementById('cycle-sub').textContent = fmtDate(r.inicio) + ' → ' + fmtDate(r.fim);
}

function gastosAtivos() {
  var r = getCycleRange(currentCycle);
  return gastos.filter(function(g) {
    var d = new Date(g.date + 'T12:00:00');
    var ok_data = d >= r.inicio && d <= r.fim;
    if (!ok_data) return false;
    if (currentCycle === 'familia') return true;
    return g.pessoa === currentCycle || g.pessoa === 'familia';
  });
}

function spentByCat(id) {
  return gastosAtivos().filter(function(g){return g.cat===id;}).reduce(function(s,g){return s+g.val;},0);
}

function fmtBRL(v) { return 'R$ ' + Math.round(Math.abs(v)).toLocaleString('pt-BR'); }
function fmtDec(v) { return 'R$ ' + v.toFixed(2).replace('.',','); }

function render() {
  renderSummary();
  renderCats();
  if (currentTab === 'historico') renderHist();
}

function renderSummary() {
  var lista = gastosAtivos();
  var total = lista.reduce(function(s,g){return s+g.val;},0);
  var saldo = TETO_TOTAL - total;
  var over  = CATS.filter(function(c){return spentByCat(c.id)>=c.teto;}).length;
  var classeGasto = total > TETO_TOTAL ? 'bad' : total > TETO_TOTAL*0.8 ? 'warn' : '';
  var classeSaldo = saldo < 0 ? 'bad' : saldo < TETO_TOTAL*0.15 ? 'warn' : 'ok';
  document.getElementById('summary').innerHTML =
    '<div class="sum-card"><div class="sum-label">Gasto no ciclo</div><div class="sum-val '+classeGasto+'">'+fmtBRL(total)+'</div></div>' +
    '<div class="sum-card"><div class="sum-label">Saldo disponível</div><div class="sum-val '+classeSaldo+'">'+(saldo<0?'- ':'')+fmtBRL(saldo)+'</div></div>' +
    '<div class="sum-card"><div class="sum-label">Teto total</div><div class="sum-val">'+fmtBRL(TETO_TOTAL)+'</div></div>' +
    '<div class="sum-card"><div class="sum-label">Estouradas</div><div class="sum-val '+(over>0?'bad':'')+'">'+over+'</div></div>';
}

function renderCats() {
  var el = document.getElementById('cats');
  el.innerHTML = '';
  CATS.forEach(function(c) {
    var spent = spentByCat(c.id);
    var pct   = Math.min(100, Math.round(spent/c.teto*100));
    var over  = spent > c.teto;
    var saldo = c.teto - spent;
    var saldoTxt = over
      ? '⚠ Estourou ' + fmtBRL(Math.abs(saldo))
      : saldo > 0 ? 'Saldo: '+fmtBRL(saldo)+' ('+pct+'% usado)' : 'No limite';
    var div = document.createElement('div');
    div.className = 'cat-card';
    div.innerHTML =
      '<div class="cat-row">' +
        '<div class="cat-left"><div class="cat-dot" style="background:'+c.color+'"></div><div class="cat-name">'+c.name+'</div></div>' +
        '<div class="cat-right"><div class="cat-spent" style="color:'+(over?'#A32D2D':c.dark)+'">'+fmtBRL(spent)+'</div><div class="cat-teto">de '+fmtBRL(c.teto)+'</div></div>' +
      '</div>' +
      '<div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%;background:'+(over?'#A32D2D':c.color)+'"></div></div>' +
      '<div class="cat-saldo'+(over?' over':'')+'">'+saldoTxt+'</div>';
    el.appendChild(div);
  });
}

function renderHist() {
  var wrap = document.getElementById('hist-wrap');
  var lista = gastosAtivos().slice().sort(function(a,b){
    return b.date.localeCompare(a.date) || b.ts - a.ts;
  });
  if (!lista.length) {
    wrap.innerHTML = '<div class="empty">Nenhum gasto registrado neste ciclo.</div>';
    return;
  }
  var grupos = {};
  lista.forEach(function(g){
    if (!grupos[g.date]) grupos[g.date] = [];
    grupos[g.date].push(g);
  });
  wrap.innerHTML = '';
  Object.keys(grupos).sort(function(a,b){return b.localeCompare(a);}).forEach(function(date) {
    var d = new Date(date+'T12:00:00');
    var label = d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
    label = label.charAt(0).toUpperCase()+label.slice(1);
    var gl = document.createElement('div');
    gl.className = 'hist-group-label';
    gl.textContent = label;
    wrap.appendChild(gl);
    grupos[date].forEach(function(g) {
      var cat = CATS.find(function(c){return c.id===g.cat;});
      var item = document.createElement('div');
      item.className = 'hist-item';
      var meta = [];
      if (g.desc) meta.push(g.desc);
      if (g.pessoa && g.pessoa !== 'familia') meta.push(g.pessoa.charAt(0).toUpperCase()+g.pessoa.slice(1));
      item.innerHTML =
        '<div class="hist-left">' +
          '<div class="hist-cat">'+(cat?cat.name:'?')+'</div>' +
          (meta.length ? '<div class="hist-meta">'+meta.join(' · ')+'</div>' : '') +
        '</div>' +
        '<div class="hist-right">' +
          '<div class="hist-val">'+fmtDec(g.val)+'</div>' +
          '<div class="hist-del" data-ts="'+g.ts+'">×</div>' +
        '</div>';
      item.querySelector('.hist-del').addEventListener('click', function(){
        delGasto(parseInt(this.getAttribute('data-ts')));
      });
      wrap.appendChild(item);
    });
  });
}

function setCycle(type) {
  currentCycle = type;
  ['thiago','taina','familia'].forEach(function(t){
    document.getElementById('btn-'+t).classList.toggle('active', t===type);
  });
  updateCycleSub();
  render();
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  document.getElementById('view-tetos').style.display     = tab==='tetos'?'block':'none';
  document.getElementById('view-historico').style.display  = tab==='historico'?'block':'none';
  if (tab==='historico') renderHist();
}

function openModal() {
  var hoje = new Date();
  var iso  = hoje.getFullYear()+'-'+fmt2(hoje.getMonth()+1)+'-'+fmt2(hoje.getDate());
  document.getElementById('inp-date').value  = iso;
  document.getElementById('inp-val').value   = '';
  document.getElementById('inp-desc').value  = '';
  document.getElementById('err-val').style.display = 'none';
  document.getElementById('overlay').classList.add('open');
  setTimeout(function(){ document.getElementById('inp-val').focus(); }, 300);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

function saveGasto() {
  var val = parseFloat(document.getElementById('inp-val').value);
  if (!val || val <= 0) {
    document.getElementById('err-val').style.display = 'block';
    return;
  }
  document.getElementById('err-val').style.display = 'none';
  var g = {
    ts:     Date.now(),
    cat:    document.getElementById('inp-cat').value,
    val:    val,
    date:   document.getElementById('inp-date').value,
    pessoa: document.getElementById('inp-pessoa').value,
    desc:   document.getElementById('inp-desc').value.trim()
  };
  gastos.push(g);
  saveLocal();
  fbSave();
  closeModal();
  render();
}

function delGasto(ts) {
  if (!confirm('Remover este gasto?')) return;
  gastos = gastos.filter(function(g){return g.ts!==ts;});
  saveLocal();
  fbSave();
  render();
}

function saveLocal() {
  try { localStorage.setItem('orcfam_v2', JSON.stringify(gastos)); } catch(e){}
}

function loadLocal() {
  try { return JSON.parse(localStorage.getItem('orcfam_v2')||'[]'); } catch(e){ return []; }
}

function setSyncDot(state) {
  var d = document.getElementById('sync-dot');
  d.className = 'sync-dot'+(state?' '+state:'');
}

function fbSave() {
  if (!db) return;
  setSyncDot('syncing');
  db.ref('gastos_v2').set(gastos)
    .then(function(){setSyncDot('');})
    .catch(function(){setSyncDot('error');});
}

var FB_CONFIG = {
  apiKey:            "AIzaSyAxHWmo4uuQoAEnK1zEunk91MIh_YS-5Lw",
  authDomain:        "orcamento-familia-b9681.firebaseapp.com",
  databaseURL:       "https://orcamento-familia-b9681-default-rtdb.firebaseio.com",
  projectId:         "orcamento-familia-b9681",
  storageBucket:     "orcamento-familia-b9681.firebasestorage.app",
  messagingSenderId: "945768398506",
  appId:             "1:945768398506:web:9bce437bbbd724b2799ad3"
};

function initFirebase() {
  var s1 = document.createElement('script');
  s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
  s1.onload = function() {
    var s2 = document.createElement('script');
    s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
    s2.onload = function() {
      try {
        firebase.initializeApp(FB_CONFIG);
        db = firebase.database();
        setSyncDot('syncing');
        db.ref('gastos_v2').on('value', function(snap) {
          var remote = snap.val();
          if (Array.isArray(remote) && remote.length > 0) {
            var tsLocais = {};
            gastos.forEach(function(g){ tsLocais[g.ts] = true; });
            remote.forEach(function(g){ if (!tsLocais[g.ts]) gastos.push(g); });
            var tsRemotos = {};
            remote.forEach(function(g){ tsRemotos[g.ts] = true; });
            var temNovos = gastos.some(function(g){ return !tsRemotos[g.ts]; });
            if (temNovos) db.ref('gastos_v2').set(gastos);
            saveLocal();
            render();
          } else if (!remote && gastos.length > 0) {
            db.ref('gastos_v2').set(gastos);
          }
          setSyncDot('');
        });
      } catch(e) {
        setSyncDot('error');
      }
    };
    s2.onerror = function(){ setSyncDot('error'); };
    document.head.appendChild(s2);
  };
  s1.onerror = function(){ setSyncDot('error'); };
  document.head.appendChild(s1);
}

function populateSelect() {
  var sel = document.getElementById('inp-cat');
  CATS.forEach(function(c){
    var o = document.createElement('option');
    o.value = c.id;
    o.textContent = c.name;
    sel.appendChild(o);
  });
}

// INIT
gastos = loadLocal();
populateSelect();
updateCycleSub();
render();

document.getElementById('fab-btn').addEventListener('click', function(){ openModal(); });
document.getElementById('btn-save').addEventListener('click', function(){ saveGasto(); });
document.getElementById('overlay').addEventListener('click', function(e){
  if (e.target === this) closeModal();
});

initFirebase();
</script>
